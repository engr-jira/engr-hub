name: hub-ci

on:
  pull_request:
    branches: [ "main" ]

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show changed files
        run: |
          echo "Changed files:"
          git diff --name-only origin/main...HEAD || true

      - name: Basic sensitive keyword check
        run: |
          ! grep -RInE "(api[_-]?key|secret|token|password|passwd|client_secret)" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude=package-lock.json \
            --exclude=*.md

      - name: Basic JS syntax check
        run: |
          if find . -name "*.js" -not -path "./node_modules/*" | grep -q .; then
            find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -I{} node --check "{}"
          else
            echo "No JS files found."
          fi
